<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg{fill:#f5f3ed}.paper{fill:#fff;stroke:#30354d;stroke-width:4}.ink{fill:#30354d}.muted{fill:#e6e4dd;stroke:#30354d;stroke-width:3}.line{fill:none;stroke:#30354d;stroke-width:3;stroke-linecap:round}.dash{fill:none;stroke:#6f7282;stroke-width:3;stroke-dasharray:10 9}.title{font:700 28px Arial,sans-serif;fill:#30354d}.label{font:700 18px Arial,sans-serif;fill:#30354d}.small{font:16px Arial,sans-serif;fill:#5e6272}.note{fill:#fff2a8;stroke:#30354d;stroke-width:3}
    </style>
  </defs>
  <rect width="1600" height="1000" class="bg"/>
  <text x="70" y="65" class="title">Sam Speaks · low-fidelity design progression</text>
  <text x="70" y="95" class="small">Early wireframes to validate hierarchy, task flow, and separation of child and adult modes before visual styling.</text>

  <g transform="translate(70 135)">
    <rect width="680" height="390" rx="20" class="paper"/>
    <text x="25" y="42" class="label">A. Child communication board</text>
    <rect x="25" y="60" width="630" height="65" rx="12" class="muted"/>
    <text x="45" y="86" class="small">MY MESSAGE</text><text x="45" y="112" class="label">I   want   water</text>
    <rect x="520" y="73" width="115" height="39" rx="10" class="paper"/><text x="552" y="99" class="label">Speak</text>
    <g transform="translate(25 148)">
      <g><rect width="135" height="98" rx="12" class="paper"/><circle cx="68" cy="40" r="19" class="muted"/><text x="61" y="82" class="label">I</text></g>
      <g transform="translate(165)"><rect width="135" height="98" rx="12" class="paper"/><path d="M30 40h75m-20-17 20 17-20 17" class="line"/><text x="44" y="82" class="label">want</text></g>
      <g transform="translate(330)"><rect width="135" height="98" rx="12" class="paper"/><path d="M50 20h35l-5 44H55z" class="muted"/><text x="42" y="82" class="label">water</text></g>
      <g transform="translate(495)"><rect width="135" height="98" rx="12" class="paper"/><circle cx="68" cy="39" r="24" class="muted"/><path d="M57 39h22m-11-11v22" class="line"/><text x="48" y="82" class="label">help</text></g>
      <g transform="translate(0 122)"><rect width="135" height="98" rx="12" class="paper"/><text x="48" y="56" class="label">yes</text></g>
      <g transform="translate(165 122)"><rect width="135" height="98" rx="12" class="paper"/><text x="53" y="56" class="label">no</text></g>
      <g transform="translate(330 122)"><rect width="135" height="98" rx="12" class="paper"/><text x="45" y="56" class="label">stop</text></g>
      <g transform="translate(495 122)"><rect width="135" height="98" rx="12" class="paper"/><text x="48" y="56" class="label">more</text></g>
    </g>
  </g>

  <g transform="translate(850 135)">
    <rect width="680" height="390" rx="20" class="paper"/>
    <text x="25" y="42" class="label">B. Add a personalized picture</text>
    <circle cx="56" cy="91" r="19" class="ink"/><text x="50" y="98" font-family="Arial" font-size="18" fill="white">1</text>
    <rect x="90" y="70" width="250" height="43" rx="8" class="paper"/><text x="105" y="98" class="small">Label: My bottle</text>
    <rect x="365" y="70" width="285" height="43" rx="8" class="paper"/><text x="380" y="98" class="small">Spoken phrase: my bottle</text>
    <circle cx="56" cy="157" r="19" class="ink"/><text x="50" y="164" font-family="Arial" font-size="18" fill="white">2</text>
    <rect x="90" y="136" width="250" height="120" rx="10" class="dash"/><text x="147" y="202" class="small">Upload familiar photo</text>
    <rect x="365" y="136" width="135" height="120" rx="10" class="paper"/><rect x="395" y="153" width="75" height="70" rx="8" class="muted"/><text x="391" y="244" class="small">Live preview</text>
    <circle cx="56" cy="301" r="19" class="ink"/><text x="50" y="308" font-family="Arial" font-size="18" fill="white">3</text>
    <rect x="90" y="280" width="210" height="44" rx="8" class="paper"/><text x="107" y="308" class="small">Board: Home only</text>
    <rect x="515" y="280" width="135" height="48" rx="10" class="ink"/><text x="553" y="311" font-family="Arial" font-size="18" font-weight="700" fill="white">Save</text>
    <rect x="365" y="280" width="125" height="48" rx="10" class="paper"/><text x="400" y="311" class="small">Cancel</text>
  </g>

  <g transform="translate(70 585)">
    <rect width="680" height="330" rx="20" class="paper"/>
    <text x="25" y="42" class="label">C. Adult layout settings</text>
    <rect x="25" y="65" width="220" height="235" rx="14" class="muted"/>
    <text x="48" y="100" class="label">Adult setup</text>
    <text x="48" y="143" class="small">My words</text><text x="48" y="180" class="small">Add a picture</text><text x="48" y="217" class="label">Board layout</text><text x="48" y="254" class="small">Child preview</text>
    <text x="280" y="92" class="label">Choose picture size</text>
    <rect x="280" y="115" width="170" height="120" rx="12" class="paper"/><g transform="translate(310 132)"><rect width="48" height="28" rx="5" class="muted"/><rect x="62" width="48" height="28" rx="5" class="muted"/><rect y="38" width="48" height="28" rx="5" class="muted"/><rect x="62" y="38" width="48" height="28" rx="5" class="muted"/></g><text x="315" y="219" class="small">Big pictures</text>
    <rect x="475" y="115" width="170" height="120" rx="12" class="paper"/><g transform="translate(495 132)"><rect width="36" height="28" rx="5" class="muted"/><rect x="46" width="36" height="28" rx="5" class="muted"/><rect x="92" width="36" height="28" rx="5" class="muted"/><rect y="38" width="36" height="28" rx="5" class="muted"/><rect x="46" y="38" width="36" height="28" rx="5" class="muted"/><rect x="92" y="38" width="36" height="28" rx="5" class="muted"/></g><text x="518" y="219" class="small">More words</text>
    <rect x="280" y="260" width="365" height="40" rx="8" class="note"/><text x="298" y="286" class="small">Core words keep the same positions.</text>
  </g>

  <g transform="translate(850 585)">
    <rect width="680" height="330" rx="20" class="paper"/>
    <text x="25" y="42" class="label">Design questions for early evaluation</text>
    <rect x="30" y="74" width="610" height="50" rx="8" class="note"/><text x="50" y="106" class="small">Can the child find Help, Stop, and No without opening a category?</text>
    <rect x="30" y="140" width="610" height="50" rx="8" class="note"/><text x="50" y="172" class="small">Is each picture recognizable before reading its label?</text>
    <rect x="30" y="206" width="610" height="50" rx="8" class="note"/><text x="50" y="238" class="small">Can an adult add one Home-only picture without assistance?</text>
    <rect x="30" y="272" width="610" height="35" rx="8" class="note"/><text x="50" y="296" class="small">Does changing layout preserve the user's mental map?</text>
  </g>
</svg>
